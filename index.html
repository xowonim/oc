<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xowon's OC</title>
<script>
  // 다크모드는 저장된 값대로 가장 먼저 적용해서, 밝은 화면이 잠깐 번쩍이는 걸 막는다.
  try {
    document.documentElement.setAttribute('data-theme', localStorage.getItem('oc_dark_mode') === '1' ? 'dark' : 'light');
  } catch (e) {}
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<link rel="stylesheet" href="css/style.css?v=60">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <button class="logo-home" id="logoHome">xowon's OC</button>
      <nav class="nav-list" id="navList"></nav>
      <div id="subListWrap"></div>
    </aside>

    <main class="content">
      <div class="content-header">
        <button class="btn-create-top btn-order-toggle" id="orderEditBtn" style="display:none;">↕ 순서 편집</button>
        <button class="btn-create-top" id="createTopBtn">+ 캐릭터 생성</button>
      </div>
      <div class="gallery" id="gallery"></div>
    </main>
  </div>

  <!-- 캐릭터 상세 모달 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard">
      <button class="modal-close" id="modalClose" aria-label="닫기">&times;</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- 캐릭터 생성/수정 폼 -->
  <div class="modal-overlay" id="formOverlay">
    <div class="modal-card" id="formCard">
      <button class="modal-close" id="formClose" aria-label="닫기">&times;</button>
      <div class="modal-body" id="formBody"></div>
    </div>
  </div>

  <!-- 설정 모달 -->
  <div class="modal-overlay" id="settingsOverlay">
    <div class="modal-card" id="settingsCard">
      <button class="modal-close" id="settingsClose" aria-label="닫기">&times;</button>
      <div class="modal-body" id="settingsBody"></div>
    </div>
  </div>

  <!-- 화면 왼쪽 아래 동그란 설정 아이콘 -->
  <button class="settings-fab" id="settingsFab" aria-label="설정">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V19.5a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H4.5a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.08a1.7 1.7 0 0 0 1.03-1.56V4.5a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.03 1.56h.08a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.56 1.03h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.56 1.03z"/>
    </svg>
  </button>

  <!-- 이미지 자르기 모달 -->
  <div class="modal-overlay" id="cropOverlay">
    <div class="modal-card crop-card" id="cropCard">
      <button class="modal-close" id="cropClose" aria-label="닫기">&times;</button>
      <div class="modal-body">
        <h2 class="form-title">이미지 확대/자르기</h2>
        <p class="form-hint">마우스 휠(또는 손가락으로 확대/축소)로 확대하고, 드래그해서 원하는 부분을 맞춘 다음 적용해주세요.</p>
        <div class="crop-container">
          <img id="cropImage" alt="자를 이미지">
        </div>
        <div class="crop-controls">
          <button type="button" class="template-mini-btn" id="cropZoomIn">확대 +</button>
          <button type="button" class="template-mini-btn" id="cropZoomOut">축소 -</button>
          <button type="button" class="template-mini-btn" id="cropRotate">회전</button>
          <button type="button" class="template-mini-btn" id="cropReset">초기화</button>
        </div>
        <button class="form-submit" id="cropApply">이대로 적용하기</button>
        <button class="form-submit form-submit-secondary" id="cropSkip">자르지 않고 원본 그대로</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <script src="js/app.js?v=60"></script>
</body>
</html>
