<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untitled</title>
<script>
  // 다크모드/사이트 색상은 저장된 값대로 가장 먼저 적용해서, 화면이 잠깐 번쩍이는 걸 막는다.
  // (app.js도 이 함수를 그대로 불러다 쓴다)
  window.OC_DEFAULT_COLORS = {
    light: { bg: '#ffffff', point: '#9a9a9a', text: '#222222' },
    dark: { bg: '#15161a', point: '#9a9a9a', text: '#e9e9ec' }
  };
  window.ocApplyTheme = function (colors) {
    var root = document.documentElement;
    var dark = false;
    try { dark = localStorage.getItem('oc_dark_mode') === '1'; } catch (e) {}
    if (!colors) {
      try { colors = (JSON.parse(localStorage.getItem('oc_site_cache') || '{}') || {}).colors; } catch (e) {}
    }
    var mode = dark ? 'dark' : 'light';
    var def = window.OC_DEFAULT_COLORS[mode];
    var c = (colors && colors[mode]) || {};
    var bg = c.bg || def.bg, point = c.point || def.point, text = c.text || def.text;
    function rgb(h) { h = h.replace('#', ''); return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
    function mix(t) {
      var x = rgb(bg), y = rgb(text);
      return '#' + [0, 1, 2].map(function (i) {
        var v = Math.round(x[i] * (1 - t) + y[i] * t);
        return (v < 16 ? '0' : '') + v.toString(16);
      }).join('');
    }
    // 포인트색 위에 올라가는 글씨: 포인트색이 너무 짙거나 옅어서 글씨색이 안 보이면,
    // 설정한 "글씨색"과 "배경색" 중 포인트색과 더 또렷하게 구분되는 쪽을 쓴다.
    function lum(h) {
      var v = rgb(h).map(function (n) { n /= 255; return n <= 0.03928 ? n / 12.92 : Math.pow((n + 0.055) / 1.055, 2.4); });
      return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
    }
    function contrast(a, b) {
      var x = lum(a), y = lum(b);
      return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
    }
    // 기본은 배경색(라이트=흰색, 다크=어두운색)으로 쓰고, 그래서는 안 읽힐 때만 글씨색을 쓴다.
    var onPoint = contrast(bg, point) >= 2.5 ? bg : text;
    root.setAttribute('data-theme', mode);
    var st = root.style;
    st.setProperty('--bg', bg);
    st.setProperty('--surface', bg);
    st.setProperty('--text', text);
    st.setProperty('--card-bg', mix(0.04));
    st.setProperty('--hover-bg', mix(0.06));
    st.setProperty('--chip-bg', mix(0.09));
    st.setProperty('--border', mix(0.14));
    st.setProperty('--placeholder', mix(0.28));
    st.setProperty('--sub-text', mix(0.5));
    st.setProperty('--muted-text', mix(0.72));
    st.setProperty('--invert-bg', point);
    st.setProperty('--invert-text', onPoint);
  };
  try { window.ocApplyTheme(); } catch (e) {}
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<link rel="stylesheet" href="css/style.css?v=63">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <button class="logo-home" id="logoHome">Untitled</button>
      <nav class="nav-list" id="navList"></nav>
      <div id="subListWrap"></div>
    </aside>

    <main class="content">
      <div class="content-header">
        <button class="btn-create-top btn-order-toggle" id="orderEditBtn" style="display:none;">↕ 순서 편집</button>
        <button class="btn-create-top" id="createTopBtn">+ 캐릭터 생성</button>
      </div>
      <div class="gallery" id="gallery"></div>
    </main>
  </div>

  <!-- 캐릭터 상세 모달 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard">
      <button class="modal-close" id="modalClose" aria-label="닫기">&times;</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- 캐릭터 생성/수정 폼 -->
  <div class="modal-overlay" id="formOverlay">
    <div class="modal-card" id="formCard">
      <button class="modal-close" id="formClose" aria-label="닫기">&times;</button>
      <div class="modal-body" id="formBody"></div>
    </div>
  </div>

  <!-- 설정 모달 -->
  <div class="modal-overlay" id="settingsOverlay">
    <div class="modal-card" id="settingsCard">
      <button class="modal-close" id="settingsClose" aria-label="닫기">&times;</button>
      <div class="modal-body" id="settingsBody"></div>
    </div>
  </div>

  <!-- 화면 왼쪽 아래 동그란 설정 아이콘 -->
  <button class="settings-fab" id="settingsFab" aria-label="설정">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V19.5a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H4.5a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.08a1.7 1.7 0 0 0 1.03-1.56V4.5a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.03 1.56h.08a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.56 1.03h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.56 1.03z"/>
    </svg>
  </button>

  <!-- 이미지 자르기 모달 -->
  <div class="modal-overlay" id="cropOverlay">
    <div class="modal-card crop-card" id="cropCard">
      <button class="modal-close" id="cropClose" aria-label="닫기">&times;</button>
      <div class="modal-body">
        <h2 class="form-title">이미지 확대/자르기</h2>
        <p class="form-hint">마우스 휠(또는 손가락으로 확대/축소)로 확대하고, 드래그해서 원하는 부분을 맞춘 다음 적용해주세요.</p>
        <div class="crop-container">
          <img id="cropImage" alt="자를 이미지">
        </div>
        <div class="crop-controls">
          <button type="button" class="template-mini-btn" id="cropZoomIn">확대 +</button>
          <button type="button" class="template-mini-btn" id="cropZoomOut">축소 -</button>
          <button type="button" class="template-mini-btn" id="cropRotate">회전</button>
          <button type="button" class="template-mini-btn" id="cropReset">초기화</button>
        </div>
        <button class="form-submit" id="cropApply">이대로 적용하기</button>
        <button class="form-submit form-submit-secondary" id="cropSkip">자르지 않고 원본 그대로</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <script src="js/app.js?v=63"></script>
</body>
</html>
